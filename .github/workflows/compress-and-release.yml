name: Compress and Release

on:
  workflow_dispatch:

jobs:
  compress-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate dynamic tag
        run: |
          TAG_NAME="release-$(date +'%Y%m%d-%H%M%S')"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=Release - $(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"

      - name: Extract compressed RetroArch core into system package
        run: |
          find system -type f -path "*/assign/*.ini" | while IFS= read -r INI; do
            SYS_DIR="$(dirname "$(dirname "$(dirname "$INI")")")"
            CORE_DIR="$SYS_DIR/core"
            CORE_VAL="$(grep '^core=' "$INI" | sed 's/^core=//')"

            case "$CORE_VAL" in
              *.so)
                CORE_SRC="core/${CORE_VAL}.zip"
                if [ -f "$CORE_SRC" ]; then
                  mkdir -p "$CORE_DIR"
                  unzip -qq -o "$CORE_SRC" -d "$CORE_DIR" || echo "Warning: Failed to unzip $CORE_SRC"
                fi
                ;;
            esac
          done

      - name: Compress Extra system packages
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          # system/<name> is two levels deep. The previous ../../../artifacts
          # path assumed system/extra/<name> and wrote zips outside the
          # workspace, so Extra/Base muxzips never made it onto the release.
          for SYS in system/*; do
            [ -d "$SYS" ] || continue
            NAME="$(basename "$SYS")"
            OUT="$GITHUB_WORKSPACE/artifacts/Extra - ${NAME}.muxzip"
            echo "Compressing: (Extra) $SYS"
            (
              cd "$SYS" || exit 1
              zip -r9 "$OUT" ./* >/dev/null 2>&1 || echo "zip failed for $SYS"
            )
          done

          printf 'extra system archives: %s\n' "$(find "$GITHUB_WORKSPACE/artifacts" -name 'Extra - *.muxzip' | wc -l)"

      - name: Publish core manifest and per-core archives
        run: |
          cp data/manifest.json "$GITHUB_WORKSPACE/artifacts/core-manifest.json"

          # Archive Manager only extracts muxzip top-level folders that have a
          # matching /opt/muos/script/archive/<folder>.sh handler. A bare
          # foo_libretro.so at the zip root is skipped with no error.
          STAGE="$(mktemp -d)"
          for CORE_ZIP in core/*.so.zip; do
            [ -f "$CORE_ZIP" ] || continue
            rm -rf "$STAGE/core"
            mkdir -p "$STAGE/core"
            unzip -qq -o "$CORE_ZIP" -d "$STAGE/core" || continue
            OUT="$GITHUB_WORKSPACE/artifacts/Core - $(basename "$CORE_ZIP" .zip).muxzip"
            ( cd "$STAGE" && zip -r9 "$OUT" core >/dev/null 2>&1 ) || echo "zip failed for $CORE_ZIP"
          done
          rm -rf "$STAGE"

          printf 'manifest entries: %s\n' "$(jq 'length' "$GITHUB_WORKSPACE/artifacts/core-manifest.json")"
          printf 'core archives:    %s\n' "$(find "$GITHUB_WORKSPACE/artifacts" -name 'Core - *.muxzip' | wc -l)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          files: |
            artifacts/*.muxzip
            artifacts/core-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
