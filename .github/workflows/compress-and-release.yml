name: Compress and Release

on:
  push:
    branches: [ main ]
    paths:
      - 'core/**/*.so.zip'
      - 'data/manifest/*.json'
      - 'manifest/core/**'
      - 'system/**'
      - 'optimised/**'
      - 'optimised.sh'
  workflow_dispatch:

concurrency:
  group: compress-and-release
  cancel-in-progress: false

jobs:
  compress-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate dynamic tag
        run: |
          TAG_NAME="release-$(date +'%Y%m%d-%H%M%S')"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=Release - $(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"

      - name: Extract compressed RetroArch core into system package
        run: |
          find system -type f -path "*/assign/*.ini" | while IFS= read -r INI; do
            SYS_DIR="$(dirname "$(dirname "$(dirname "$INI")")")"
            CORE_DIR="$SYS_DIR/core"
            CORE_VAL="$(grep '^core=' "$INI" | sed 's/^core=//')"

            case "$CORE_VAL" in
              *.so)
                CORE_SRC="core/aarch64/${CORE_VAL}.zip"
                if [ -f "$CORE_SRC" ]; then
                  mkdir -p "$CORE_DIR"
                  unzip -qq -o "$CORE_SRC" -d "$CORE_DIR" || echo "Warning: Failed to unzip $CORE_SRC"
                fi
                ;;
            esac
          done

      - name: Compress Base and Extra systems
        run: |
          mkdir -p artifacts

          COMPRESS_SYSTEM() {
            ROOT="$1"
            PREFIX="$2"

            [ -d "$ROOT" ] || return

            for SYS in "$ROOT"/*; do
              [ -d "$SYS" ] || continue

              NAME="$(basename "$SYS")"
              OUT="artifacts/${PREFIX} - ${NAME}.muxzip"

              echo "Compressing: ($PREFIX) $SYS"

              (
                cd "$SYS" || exit 1
                zip -r9 "../../../$OUT" ./* >/dev/null 2>&1 || echo "zip failed for $SYS"
              )
            done
          }

          COMPRESS_SYSTEM "system" "Base"

      - name: Publish core manifest and per core archives
        run: |
          set -eu

          ARTIFACT_DIR="$PWD/artifacts"
          mkdir -p "$ARTIFACT_DIR"

          for MANIFEST_SOURCE in data/manifest/*.json; do
            [ -f "$MANIFEST_SOURCE" ] || continue

            ARCHITECTURE="$(basename "$MANIFEST_SOURCE" .json)"
            CORE_ROOT="core/$ARCHITECTURE"
            MANIFEST_OUT="$ARTIFACT_DIR/core-manifest-$ARCHITECTURE.json"
            ARCHIVE_LIST="$RUNNER_TEMP/core-archives-$ARCHITECTURE.tsv"
            : >"$ARCHIVE_LIST"

            case "$ARCHITECTURE" in
              aarch64 | armhf | x86_64 | x86 | riscv64) ;;
              *) echo "Unsupported manifest architecture: $ARCHITECTURE" >&2; exit 1 ;;
            esac
            jq -e --arg architecture "$ARCHITECTURE" '
              type == "object" and all(.[]; .architecture == $architecture)
            ' "$MANIFEST_SOURCE" >/dev/null

            while IFS= read -r MANIFEST_KEY; do
              [ -f "$CORE_ROOT/$MANIFEST_KEY" ] || {
                echo "Manifest archive is missing: $CORE_ROOT/$MANIFEST_KEY" >&2
                exit 1
              }
            done < <(jq -r 'keys[]' "$MANIFEST_SOURCE")

            for CORE_ZIP in "$CORE_ROOT"/*.so.zip; do
              [ -f "$CORE_ZIP" ] || continue

              NAME="$(basename "$CORE_ZIP" .zip)"
              MANIFEST_KEY="$(basename "$CORE_ZIP")"
              EXPECTED_SHA="$(jq -r --arg key "$MANIFEST_KEY" '.[$key].sha256 // empty' "$MANIFEST_SOURCE")"
              EXPECTED_SIZE="$(jq -r --arg key "$MANIFEST_KEY" '.[$key].size // empty' "$MANIFEST_SOURCE")"
              [ -n "$EXPECTED_SHA" ] && [ -n "$EXPECTED_SIZE" ] || {
                echo "Archive is missing valid manifest metadata: $CORE_ZIP" >&2
                exit 1
              }
              [ "$(sha256sum "$CORE_ZIP" | cut -d' ' -f1)" = "$EXPECTED_SHA" ] || {
                echo "Archive checksum differs from manifest: $CORE_ZIP" >&2
                exit 1
              }
              [ "$(wc -c <"$CORE_ZIP")" -eq "$EXPECTED_SIZE" ] || {
                echo "Archive size differs from manifest: $CORE_ZIP" >&2
                exit 1
              }

              STAGE="$(mktemp -d)"
              unzip -qo "$CORE_ZIP" -d "$STAGE/payload"

              mkdir -p "$STAGE/pack/core"
              find "$STAGE/payload" -maxdepth 1 -type f -name '*.so' -exec mv {} "$STAGE/pack/core/" \;

              if [ -n "$(find "$STAGE/payload" -mindepth 1 -maxdepth 1)" ]; then
                mkdir -p "$STAGE/pack/bios"
                find "$STAGE/payload" -mindepth 1 -maxdepth 1 -exec mv {} "$STAGE/pack/bios/" \;
              fi

              if [ "$ARCHITECTURE" = aarch64 ]; then
                ARCHIVE="$ARTIFACT_DIR/Core - $NAME.muxzip"
                ASSET="Core.-.$NAME.muxzip"
              else
                ARCHIVE="$ARTIFACT_DIR/Core - $ARCHITECTURE - $NAME.muxzip"
                ASSET="Core.-.$ARCHITECTURE.-.$NAME.muxzip"
              fi
              ( cd "$STAGE/pack" && zip -r9 "$ARCHIVE" . >/dev/null )
              rm -rf "$STAGE"

              printf '%s\t%s\t%s\t%s\n' "$NAME.zip" "$(sha256sum "$ARCHIVE" | cut -d' ' -f1)" \
                "$(wc -c <"$ARCHIVE")" "$ASSET" >>"$ARCHIVE_LIST"
            done

            jq --arg architecture "$ARCHITECTURE" --rawfile archives "$ARCHIVE_LIST" '
              with_entries(.value.architecture = $architecture) |
              reduce ($archives | split("\n")[] | select(length > 0) | split("\t")) as $a (.;
                if has($a[0]) then
                  .[$a[0]].archive_sha256 = $a[1] |
                  .[$a[0]].archive_size = ($a[2] | tonumber) |
                  .[$a[0]].asset = $a[3]
                else . end)
            ' "$MANIFEST_SOURCE" >"$MANIFEST_OUT"

            if [ "$ARCHITECTURE" = aarch64 ]; then
              cp "$MANIFEST_OUT" "$ARTIFACT_DIR/core-manifest.json"
            fi

            printf '%s manifest entries: %s\n' "$ARCHITECTURE" "$(jq 'length' "$MANIFEST_OUT")"
            printf '%s archive hashes:  %s\n' "$ARCHITECTURE" \
              "$(jq '[.[] | select(.archive_sha256)] | length' "$MANIFEST_OUT")"
          done

          printf 'core archives: %s\n' "$(find "$ARTIFACT_DIR" -name 'Core - *.muxzip' | wc -l)"

      - name: Publish core definitions
        run: |
          set -eu

          find manifest/core -type f -name '*.json' -print0 | while IFS= read -r -d '' DEFINITION; do
            jq -e '
              type == "object" and
              (.runtime == "libretro" or .runtime == "external" or .runtime == "pickles") and
              (.default | type == "string") and
              ((if .runtime == "external" then .external else .libretro end)[.default] != null)
            ' "$DEFINITION" >/dev/null
          done

          ( cd manifest && zip -qr "$GITHUB_WORKSPACE/artifacts/core-definitions.zip" core )
          printf 'core definitions: %s\n' "$(find manifest/core -type f -name '*.json' | wc -l)"

      - name: Build optimised profiles
        run: |
          set -eu

          ./optimised.sh
          cp data/optimised.json artifacts/optimised.json
          printf 'optimised profiles: %s\n' "$(jq '.content | length' artifacts/optimised.json)"

      - name: Sign core manifest and optimised profiles
        env:
          CORE_SIGNING_KEY: ${{ secrets.CORE_SIGNING_KEY }}
          CORE_PUBLIC_KEY: cb77ed50eaf8b7bd8c94943681453aba6274caf8ae554f96c352844db9c24a5b
        run: |
          set -eu

          if [ -z "$CORE_SIGNING_KEY" ]; then
            echo "The CORE_SIGNING_KEY secret is not set"
            exit 1
          fi

          KEY="$RUNNER_TEMP/core-signing.pem"
          PUB="$RUNNER_TEMP/core-signing.pub"
          trap 'rm -f "$KEY"' EXIT

          ( umask 077 && printf '%s\n' "$CORE_SIGNING_KEY" >"$KEY" )
          openssl pkey -in "$KEY" -pubout -out "$PUB"

          if [ "$(openssl pkey -pubin -in "$PUB" -outform DER | tail -c 32 | od -An -tx1 | tr -d " \n")" != "$CORE_PUBLIC_KEY" ]; then
            echo "The CORE_SIGNING_KEY secret does not match the public key built into the frontend"
            exit 1
          fi

          for MANIFEST in artifacts/core-manifest*.json artifacts/core-definitions.zip artifacts/optimised.json; do
            openssl pkeyutl -sign -inkey "$KEY" -rawin -in "$MANIFEST" -out "$MANIFEST.sig"
            openssl pkeyutl -verify -pubin -inkey "$PUB" -rawin -in "$MANIFEST" -sigfile "$MANIFEST.sig"

            if [ "$(wc -c <"$MANIFEST.sig")" -ne 64 ]; then
              echo "Unexpected signature size for $MANIFEST"
              exit 1
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          files: |
            artifacts/*.muxzip
            artifacts/core-manifest*.json
            artifacts/core-manifest*.json.sig
            artifacts/core-definitions.zip
            artifacts/core-definitions.zip.sig
            artifacts/optimised.json
            artifacts/optimised.json.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
